name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Worker Python dependencies
        run: |
          python -m pip install --upgrade pip
          rm -rf python_modules
          python -m pip install --target python_modules --no-compile -r requirements.cloudflare.txt
          # Remove native extensions not supported by Python Workers runtime.
          find python_modules -name '*.so' -delete

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.71.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            AZDO_ORG
            AZDO_PROJECT
            AZDO_PAT
            GATEWAY_API_KEY
        env:
          AZDO_ORG: ${{ secrets.AZDO_ORG }}
          AZDO_PROJECT: ${{ secrets.AZDO_PROJECT }}
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
