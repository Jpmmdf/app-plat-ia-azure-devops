[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-plat-azure-devops-gateway"
version = "0.1.0"
description = "FastAPI gateway for Azure DevOps Scrum bootstrap"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.3",
  "pydantic==2.12.5",
  "httpx==0.28.1",
  "uvicorn[standard]==0.44.0",
]

[dependency-groups]
dev = [
  "workers-py>=0.2.0",
  "workers-runtime-sdk>=0.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
